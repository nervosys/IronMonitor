name: CI

# Every job below builds with `--all-features`, not `--features full`.
#
# `full` deliberately omits `jetson-utils`, so CI never compiled the code behind
# it: `src/utils/{swap,clocks,power_mode,security}.rs`. That is shipped code a user
# can turn on, and it is the most safety-sensitive code in the repository — the
# feature's own comment points at SECURITY.md. It accumulated 25 clippy warnings
# without a single CI run ever looking at it. `jetson-utils` enables no extra
# dependencies (`jetson-utils = []`); it only gates `cfg`, so building everything
# costs nothing but catches that whole surface.
#
# Clippy additionally runs with `--all-targets`. Without it, examples and
# integration tests go unlinted — which is how `examples/agent_backends.rs` came to
# abort on its own second step, unnoticed, for months.
#
# The delta is not hypothetical: `--features full` runs 70 doc tests where
# `--all-features` runs 73, and the three it skipped did not compile.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libssl-dev
      - run: cargo check --all-features --all-targets

  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    # `--all-features` enables everything at once, which is the one combination a
    # user is least likely to pick. It cannot catch a feature that is broken when
    # enabled *alone*, because some other feature always supplies what it is
    # missing.
    #
    # In 3.0.0 that gap was live: `simon` called `simonlib::gui::run()` in the
    # `None` arm of the command match without a `cfg(feature = "gui")`, so
    # `--no-default-features --features cli` failed with five unresolved imports.
    # The README advertised `cli` as a standalone flag for eight published
    # versions. Every CI job was green throughout, because every one of them
    # enabled `gui` too.
    #
    # One job looping rather than a matrix: the checks share a target directory,
    # so dependencies are built once instead of nineteen times.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libssl-dev
      - name: Check every feature in isolation
        run: |
          set -u
          # Read the advertised features from the manifest rather than a list kept
          # here, so a feature added later is covered without touching this file.
          # Optional dependencies also appear in cargo's feature table as implicit
          # features; those are excluded, since checking `clap` or `tokio` in
          # isolation tests cargo, not this crate.
          features=$(cargo metadata --no-deps --format-version 1 | node -e "
          let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
            const p=JSON.parse(s).packages.find(p=>p.name==='silicon-monitor');
            const optional=new Set(p.dependencies.filter(d=>d.optional).map(d=>d.name));
            console.log(Object.keys(p.features).filter(f=>f!=='default'&&!optional.has(f)).join('\n'));
          });")
          # --all-targets, so examples and test targets are covered too. Without
          # it this job checked only the library and binaries, and missed three
          # things of exactly the kind it exists to find: examples/gui.rs naming
          # `simonlib::gui` with no required-features, a #[test] in
          # platform/windows.rs calling `num_cpus` (an optional dependency the
          # `cli` feature supplies), and examples/all_gpus.rs failing to infer a
          # HashMap type with no vendor feature enabled.
          failed=()
          echo '--- no features ---'
          cargo check --quiet --no-default-features --all-targets || failed+=("(none)")
          for f in $features; do
            echo "--- $f ---"
            cargo check --quiet --no-default-features --all-targets --features "$f" || failed+=("$f")
          done
          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::feature(s) do not build in isolation: ${failed[*]}"
            exit 1
          fi
          echo "all feature combinations build"

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports, even when another has already failed.
      #
      # With the default fail-fast, one red platform cancels the other two and
      # the run says only "something broke somewhere". Seven defects were found
      # in this suite over a week in August 2026, and they surfaced one per push
      # rather than together: macOS failing cancelled Linux, so the Linux
      # failures were invisible until macOS was fixed, and the next Linux
      # failure was invisible until that one was. Three of the seven could only
      # be reproduced on a platform the author did not have.
      #
      # A cancelled job is not a passing job, and a matrix that stops at the
      # first failure turns a three-platform check into a one-platform check
      # whose platform is whichever finished first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # eframe links against the system windowing and GL libraries on Linux. The
      # runners do not carry them, and their absence surfaces as a linker error
      # rather than anything naming a GUI.
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libssl-dev
      # Documentation tests need a git checkout with history for
      # `tests/documentation_links.rs`, which enumerates tracked markdown via
      # `git ls-files`. actions/checkout provides one by default.
      - run: cargo test --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libssl-dev
      - run: cargo clippy --all-features --all-targets -- -D warnings
