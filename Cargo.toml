[package]
name = "iron-monitor"
version = "6.0.0"
edition = "2021"
# Verified by building against each installed toolchain, not asserted. This said
# 1.70 from 3.x through 5.1.0 and had not been true since the egui GUI was
# restored — nothing checks a `rust-version` that no CI job builds against.
#
# A default build works at 1.88: below that cargo refuses on `image@0.25.10` and
# `home@0.5.12`, which declare 1.88 themselves and arrive through
# eframe/egui_extras. The floor is 1.89 rather than 1.88 because `ironvault`
# needs it, and every one of its 14 published versions does, so there is nothing
# to pin back to.
#
# One value has to cover every feature combination, and the choice was between
# claiming 1.88 with a footnote for `vault` or claiming what is true of all of
# them. A field that means "1.88, except…" is the same shape of defect as an
# ontology entity declaring a provenance stronger than a row can carry: the
# reader has to know the exception to avoid being misled. So it declares the
# weakest floor that holds everywhere, and `cargo +1.89 check --all-features
# --all-targets` verifies it in one command instead of two with one expected to
# fail.
rust-version = "1.89"
default-run = "ironmon"
authors = ["nervosys"]
license = "AGPL-3.0-or-later"
description = "IronMonitor: hardware monitoring for CPUs, GPUs, NPUs, memory, I/O and network silicon on Linux, Windows and macOS, which reports what it cannot read as well as what it can"
repository = "https://github.com/nervosys/IronMonitor"
homepage = "https://github.com/nervosys/IronMonitor"
documentation = "https://docs.rs/iron-monitor"
readme = "README.md"
keywords = ["silicon", "monitor", "gpu", "cpu", "hardware"]
categories = [
    "hardware-support",
    "os",
    "api-bindings",
    "command-line-utilities",
]
exclude = [
    "assets/banner.png",
    "docs/images/",
    ".github/",
    "BUILD.md",
    "CLI.md",
    "UNIFIED_BACKEND.md",
    "AI_INTEGRATION.md",
    "ROADMAP.md",
    "CHANGELOG.md",
    "HANDOFF.md",
]

[lib]
name = "ironmonlib"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

# `examples/gui.rs` names `ironmonlib::gui` and `eframe` directly, so it cannot
# build without the feature that supplies them. Without this, `cargo check
# --all-targets` on any feature set lacking `gui` fails on the example rather than
# skipping it — the same shape as the `cli`-without-`gui` breakage fixed in 3.0.1,
# and missed by the Feature combinations job because that job checks default
# targets rather than `--all-targets`.
[[example]]
name = "gui"
path = "examples/gui.rs"
required-features = ["gui"]

[[bin]]
name = "ironmon"
path = "src/bin/main.rs"
required-features = ["cli"]

# AI Monitor (amon) - dedicated AI agent interface
# `imon` is the short name for the same tool: one binary, two names, so
# `ironmon snapshot` and `imon snapshot` are the same command. Cargo builds it
# from the same source rather than a shim, which keeps them from drifting.
[[bin]]
name = "imon"
path = "src/bin/main.rs"
required-features = ["cli"]

[[bin]]
name = "amon"
path = "src/bin/amon.rs"
required-features = ["cli"]

[dependencies]
# Core dependencies
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"                                    # For TSDB binary serialization
toml = "0.8"
log = "0.4"
lru = "0.12"                                       # For agent response caching
arc-swap = "1.9.2"
chrono = { version = "0.4", features = ["serde"] }
# File integrity needs a cryptographic hash. Size and mtime are trivially
# forged by anything that can write the file in the first place, and detection
# software that overstates what it checked is worse than none.
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"                                # Used unconditionally by the agent module

# Optional dependencies for the CLI and TUI
clap = { version = "4.5", features = ["derive"], optional = true }
colored = { version = "2.1", optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
tokio = { version = "1.41", features = ["full"], optional = true }
hostname = { version = "0.4", optional = true }
num_cpus = { version = "1.16", optional = true }
ctrlc = { version = "3.4", optional = true }

# Optional dependencies for the GUI
# `default-features = false` drops eframe's windowing backends along with the
# renderer defaults. On Windows and macOS winit has exactly one backend and needs
# no feature to find it, so nothing appeared wrong; on Linux it has two and picks
# neither, failing the build at `compile_error!("The platform you're compiling for
# is not supported by winit")`. Both are named here so a Linux desktop session of
# either kind works — this is a compile-time backend selection, not a runtime one.
eframe = { version = "0.30", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "x11",
    "wayland",
] }
egui = { version = "0.30", optional = true }
egui_extras = { version = "0.30", optional = true, features = ["all_loaders"] }
egui_plot = { version = "0.30", optional = true }
open = { version = "5.3", optional = true }


# IronVault — nervosys' secure vault for AI model formats. IronMonitor reads it to
# report which models are on a machine beside the hardware that would run them;
# see `src/model_vault.rs`. Read-only: IronMonitor never unlocks a vault and holds no
# passphrase, which is possible because IronVault's metadata listing does not
# require a key.
#
# `default-features = false` on purpose. The defaults are safetensors, ndarray
# and sqlite, and sqlite means rusqlite, which means a C library — weight a
# hardware monitor should not carry for a listing.
#
# **This dependency raises the Rust requirement.** IronVault declares
# `rust-version = "1.89"` against the 1.88 this crate now requires, so the
# `vault` feature needs 1.89 while every other feature builds on 1.88. It stays
# optional and off by default for exactly that reason — the same arrangement
# `deweygui` had in 3.10.0, and the same trap that made 4.0.0 breaking when a
# GUI dependency's MSRV became the whole crate's.
ironvault = { version = "7", optional = true, default-features = false }
# Used to locate an existing IronVault installation *without* creating one —
# IronVault's own resolver, so the probe and the tool agree on where to look.
directories = { version = "5", optional = true }

# Optional dependencies for remote AI backends
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }

# Logging
env_logger = { version = "0.11", optional = true }

# NVML bindings. Declared here rather than per-target because the `nvidia` feature
# names this crate, and a feature is not target-conditional: enabling `nvidia` on
# macOS referenced a dependency that only the Linux and Windows sections declared,
# so the build failed with "unresolved import `nvml_wrapper`". The crate itself is
# a runtime loader for libnvidia-ml — it compiles anywhere and simply finds no
# library where there is no NVIDIA driver, which is correct on a machine without one.
nvml-wrapper = { version = "0.10", optional = true }

# Platform-specific dependencies.
#
# Everything above this line is cross-platform and must stay above it. The CLI,
# TUI, GUI, AI-backend, and logging dependencies used to sit *below* the Windows
# block, with no `[dependencies]` header to close it — so TOML read them as part of
# `cfg(windows)` and they existed on Windows alone. `cli`, `gui`, and
# `remote-backends` then enabled code whose crates were absent from the graph on
# Linux and macOS, and the build died with "cannot find crate `crossterm`" and a
# dozen more like it. A section header is invisible when you are reading the
# dependency beneath it, which is how this lasted: every individual line was right.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["fs", "process", "user", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
# AMD GPU support via libdrm (we'll implement direct syscalls for now)
# Intel GPU support via DRM
drm = { version = "0.14", optional = true }
drm-ffi = { version = "0.8", optional = true }

[target.'cfg(windows)'.dependencies]
# Windows API bindings
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Power",
    "Win32_System_Time",
    "Win32_Globalization",
    "Win32_System_Registry",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Storage_FileSystem",
    # PCIe link state comes from the device node property store via cfgmgr32.
    # `Get-PnpDeviceProperty` reads the same data and costs 25 s across 64
    # devices; these calls cost microseconds.
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    # USB negotiated link speed: `IOCTL_USB_GET_NODE_CONNECTION_INFORMATION_EX`
    # against the parent hub. Not a PnP property -- Windows reports it nowhere
    # else, including `Get-PnpDeviceProperty` and every `root\wmi` class.
    "Win32_Devices_Usb",
    # Audio endpoint volume, mute and which endpoint the system routes to by
    # default. All three are COM-only: no WMI class and no registry value
    # carries the live master volume of an endpoint.
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Graphics_Dxgi",
] }
# WMI for hardware monitoring (temperature, fans, etc.)
wmi = "0.14"
# Windows registry access
winreg = "0.52"

# macOS dependencies
[target.'cfg(target_os = "macos")'.dependencies]
plist = { version = "1.7", optional = true }

[dev-dependencies]
tokio = { version = "1.41", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "cpu_stats"
harness = false

[[bench]]
name = "gpu_query"
harness = false

[[bench]]
name = "process_enum"
harness = false

[features]
default = ["full"]
# Platform-specific silicon support
nvidia = ["nvml-wrapper"] # NVML support for NVIDIA GPUs (Jetson & desktop)
amd = [] # AMD GPU support via DRM (direct implementation)
jetson-utils = [
] # Unsafe Jetson utilities (swap, clocks, power_mode) - see SECURITY.md
intel = ["drm", "drm-ffi"] # Intel GPU support via i915/xe drivers
apple = [
    "plist",
] # Apple Silicon support (M1/M2/M3/M4 series) with powermetrics parsing
# Silicon monitoring features
cpu = []     # Enhanced CPU monitoring (per-core, clusters, power states)
npu = []     # NPU/ASIC monitoring (ANE, Intel NPU, AMD AI Engine)
io = []      # I/O controller monitoring (PCIe, NVMe, USB, Thunderbolt)
network = [] # Network silicon monitoring (WiFi, Ethernet, offload engines)
# CLI features
cli = [
    "clap",
    "colored",
    "ratatui",
    "crossterm",
    "tokio",

    "env_logger",
    "hostname",
    "num_cpus",
    "ctrlc",
    "remote-backends", # Required for AI backend detection (Ollama, OpenAI, etc.)
]
# GUI features
gui = [
    "eframe",
    "egui",
    "egui_extras",
    "egui_plot",
    "open",
    "tokio",

    "hostname",
    "num_cpus",
    "remote-backends", # Required for AI backend detection (Ollama, OpenAI, etc.)
]

# Read an IronVault model vault and report what it holds. Off by default:
# requires Rust 1.89, where the rest of the crate needs 1.88.
vault = ["ironvault", "directories"]
# Remote AI backend support (OpenAI, Anthropic, Ollama, etc.)
remote-backends = ["reqwest"]
# Local AI backends
local-ollama = ["remote-backends"]   # Ollama local inference server
# llama.cpp via the `llama-cli` executable (subprocess, no bindings or C++ build).
#
# In-process llama-cpp-rs FFI bindings were considered and deliberately not adopted:
# they would add a C++ toolchain to every build and complicate the 3-OS CI matrix,
# for lower per-call overhead that does not matter at ironmon's one-query-at-a-time
# usage. The subprocess path has no such cost and is discovered automatically.
local-llamacpp = []
local-vllm = ["remote-backends"]     # vLLM high-performance server
local-tensorrt = ["remote-backends"] # TensorRT-LLM optimized inference
# Full feature set with all silicon monitoring
full = [
    "nvidia",
    "amd",
    "intel",
    "apple",
    "cpu",
    "npu",
    "io",
    "network",
    "cli",
    "gui",
]
# Alias for backward compatibility
nvml = ["nvidia"]

[profile.release]
opt-level = 3
# Thin rather than fat LTO.
#
# Fat LTO (`lto = true`) reliably triggers a compiler ICE on rustc 1.97.1 for this
# crate: an unwrap in lint-level sorting, reached only under `-C lto
# -C codegen-units=1`.
#
#   error: the compiler unexpectedly panicked. This is a bug
#   core::slice::sort::unstable::heapsort::<(rustc_lint_defs::Level, &str), usize)>
#   compiler flags: -C opt-level=3 -C lto -C codegen-units=1
#
# It struck six times in one session, on the lib-test, bin, and lib targets, always
# succeeding on retry. That intermittency is what makes it worth avoiding rather
# than tolerating: a build that fails one run in five is indistinguishable from a
# flaky test suite to anyone who does not read the stack trace, and CI will retry
# it away rather than report it.
#
# Thin LTO still optimises across crate boundaries; it partitions the work instead
# of merging every module into one unit, which is both why it avoids the ICE and
# why it costs a little runtime performance. Restore `lto = true` once the
# toolchain is fixed — the change is one word.
lto = "thin"
codegen-units = 1
strip = true
